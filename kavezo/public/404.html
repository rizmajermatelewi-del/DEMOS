<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az oldal nem található · Szemközt kávézó és borbár</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem 1.25rem; background: #f6f4f0; color: #1d1b19; font: 400 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 34rem; }
.name { display: inline-block; margin-bottom: 1.6rem; padding: .35rem .8rem; border-radius: 999px; background: #2a1d16; color: #fff; font-weight: 600; font-size: .9rem; }
h1 { margin: 0 0 .8rem; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
p { margin: 0 0 1.6rem; color: #4a4642; }
a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: .7rem 1.3rem; margin: 0 .5rem .5rem 0; border-radius: 10px; background: #2a1d16; color: #fff; text-decoration: none; font-weight: 600; }
a.btn.ghost { background: none; color: #2a1d16; border: 2px solid #2a1d16; }
</style>
</head>
<body>
<main>
<span class="name">Szemközt kávézó és borbár</span>
<h1>Ez az oldal nem található</h1>
<p>Lehet, hogy elírás történt a címben, vagy az oldal megszűnt. A főoldalon mindent megtalál.</p>
<a class="btn" href="/">Vissza a főoldalra</a>
</main>
</body>
</html>
